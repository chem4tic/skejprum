<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Escape Log: nasz dziennik pokoi</title>
<meta name="description" content="Wspólny dziennik pokoi escape room dla ekipy Karola, Asi, Jano i Jaćki." />
<script>
  // Which version opens. "Legacy mode" (App settings > General) is remembered per device and
  // loads the previous version of the app. ?legacy=1 and ?legacy=0 switch it by link, which is
  // also the way out if you ever need one besides the button shown in legacy mode.
  // Otherwise phones open the phone edition (mobile.html); the "Open the desktop version" link
  // there adds ?desktop=1, remembered for this tab. The query string is passed along so a
  // Google Drive sign-in return still lands intact.
  (function () {
    var KEY = "escape-room-club-legacy-mode";
    var legacy = false;
    try {
      var qs = new URLSearchParams(location.search);
      if (qs.get("legacy") === "1") localStorage.setItem(KEY, "1");
      if (qs.get("legacy") === "0") localStorage.removeItem(KEY);
      legacy = localStorage.getItem(KEY) === "1";
      if (qs.has("legacy")) {
        qs.delete("legacy");
        var rest = qs.toString();
        history.replaceState(null, "", location.pathname + (rest ? "?" + rest : "") + location.hash);
      }
    } catch (e) { /* no storage: always the current version */ }
    window.__escapeLogLegacy = legacy;
    window.__escapeLogEntry = legacy ? "escape-room-tracker.before-redesign.jsx" : "escape-room-tracker.jsx";

    if (legacy) {
      document.addEventListener("DOMContentLoaded", function () {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = "Legacy mode \u00b7 switch to the new version";
        b.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:2147483000;padding:10px 15px;border-radius:999px;border:1px solid #3a4152;background:#252a35;color:#ece8dd;font:600 13px/1 system-ui,-apple-system,'Segoe UI',sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.45)";
        b.onclick = function () {
          try { localStorage.removeItem(KEY); } catch (e) {}
          location.replace("index.html");
        };
        document.body.appendChild(b);
      });
      return;
    }
    try {
      var phone = window.matchMedia && window.matchMedia("(max-width: 700px) and (pointer: coarse)").matches;
      if (new URLSearchParams(location.search).get("desktop") === "1") sessionStorage.setItem("escape-log-desktop", "1");
      if (phone && sessionStorage.getItem("escape-log-desktop") !== "1") {
        location.replace("mobile.html" + location.search + location.hash);
      }
    } catch (e) { /* stay on the desktop page */ }
  })();
</script>
<style>
  html, body { margin: 0; padding: 0; background: #14161c; }
  #escape-log-root { min-height: 100vh; }
  .boot-loader {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #8d92a3; font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-align: center; padding: 0 20px;
  }
</style>

<!-- Gives us Babel.transform() to strip JSX from the app file at
     runtime. -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Maps the bare import specifiers used inside escape-room-tracker.jsx
     (react, lucide-react) and below (react, react-dom/client) to real CDN
     modules. Applies to every module in this page, including ones we
     construct dynamically below. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>
</head>
<body>
<div id="escape-log-root"><div class="boot-loader">opening the door…</div></div>

<!-- The app's component code lives entirely in escape-room-tracker.jsx.
     edit that file, nothing here should need to change. This script fetches
     it, transforms the JSX with Babel, imports the result as a real ES
     module, and mounts the component it exports. Every step logs to the
     console so a failure anywhere is visible instead of silent. -->
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";

  const mount = document.getElementById("escape-log-root");

  function showError(label, err) {
    console.error(label, err);
    mount.innerHTML =
      '<div class="boot-loader">' + label + '. Check the browser console for details.</div>';
  }

  // config.js holds your Firebase/Google Drive credentials, kept out of
  // escape-room-tracker.jsx so updating the app never means re-pasting
  // them. It's optional. If it's missing, the app just falls back to
  // placeholders (fine for this preview; the hosted site needs it filled in).
  try {
    console.log("[EscapeLog] fetching config.js");
    const configRes = await fetch(`./config.js?v=${Date.now()}`, { cache: "no-store" });
    if (configRes.ok) {
      const configCode = await configRes.text();
      const script = document.createElement("script");
      script.textContent = configCode;
      document.head.appendChild(script);
      console.log("[EscapeLog] config.js loaded");
    } else {
      console.warn("[EscapeLog] config.js not found (HTTP " + configRes.status + "), using placeholder config.");
    }
  } catch (err) {
    console.warn("[EscapeLog] couldn't load config.js, using placeholder config.", err);
  }

  try {
    const entry = window.__escapeLogEntry || "escape-room-tracker.jsx";
    console.log("[EscapeLog] fetching " + entry + (window.__escapeLogLegacy ? " (legacy mode)" : ""));
    const res = await fetch(`./${entry}?v=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${entry}`);
    const raw = await res.text();
    console.log("[EscapeLog] fetched, length:", raw.length);

    const { code } = Babel.transform(raw, {
      presets: [["react", { runtime: "classic" }]],
      sourceType: "module",
      filename: entry,
    });
    console.log("[EscapeLog] Babel transform complete, length:", code.length);

    const blob = new Blob([code], { type: "text/javascript" });
    const url = URL.createObjectURL(blob);

    const mod = await import(/* @vite-ignore */ url);
    URL.revokeObjectURL(url);
    console.log("[EscapeLog] module imported:", mod);

    const App = mod.default;
    if (typeof App !== "function") {
      throw new Error(entry + " has no default export component");
    }

    createRoot(mount).render(React.createElement(App));
    console.log("[EscapeLog] mounted successfully");
  } catch (err) {
    showError("Failed to load The Escape Log", err);
  }
</script>
</body>
</html>
