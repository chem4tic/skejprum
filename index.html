<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Escape Log — nasz dziennik pokoi</title>
<meta name="description" content="Wspólny dziennik pokoi escape room dla ekipy Karola, Asi, Jano i Jaćki." />
<style>
  html, body { margin: 0; padding: 0; background: #14161c; }
  #escape-log-root { min-height: 100vh; }
  .boot-loader {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #8d92a3; font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-align: center; padding: 0 20px;
  }
</style>
 
<!-- Gives us Babel.transform() to strip JSX from escape-room-tracker.jsx at
     runtime. We call it ourselves below rather than relying on Babel's
     automatic "external src + module" scanning, which turned out to be
     unreliable across browsers. -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
 
<!-- Maps the bare import specifiers used inside escape-room-tracker.jsx
     (react, react-dom/client, lucide-react) to real CDN modules. Applies to
     every module in this page, including the one we build below. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>
</head>
<body>
<div id="escape-log-root"><div class="boot-loader">opening the door…</div></div>
 
<!-- The app itself lives entirely in escape-room-tracker.jsx — edit that
     file, nothing here should need to change. This script fetches it,
     transforms the JSX with Babel, then runs the result as a genuine ES
     module (so its import statements resolve via the import map above). -->
<script type="module">
  const mount = document.getElementById("escape-log-root");
  try {
    const res = await fetch("./escape-room-tracker.jsx");
    if (!res.ok) throw new Error(`Fetching escape-room-tracker.jsx failed: HTTP ${res.status}`);
    const raw = await res.text();
 
    const { code } = Babel.transform(raw, {
      presets: ["react"],
      sourceType: "module",
      filename: "escape-room-tracker.jsx",
    });
 
    const blob = new Blob([code], { type: "text/javascript" });
    const url = URL.createObjectURL(blob);
    await import(url);
    URL.revokeObjectURL(url);
    // escape-room-tracker.jsx self-mounts into #escape-log-root once its
    // module body finishes running — nothing further needed here.
  } catch (err) {
    console.error("Failed to load The Escape Log:", err);
    mount.innerHTML =
      '<div class="boot-loader">Something went wrong loading the app — check the browser console for details.</div>';
  }
</script>
</body>
</html>
