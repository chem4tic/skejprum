<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Escape Log — nasz dziennik pokoi</title>
<meta name="description" content="Wspólny dziennik pokoi escape room dla ekipy Karola, Asi, Jano i Jaćki." />
<style>
  html, body { margin: 0; padding: 0; background: #14161c; }
  #escape-log-root { min-height: 100vh; }
  .boot-loader {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #8d92a3; font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  }
</style>
 
<!-- In-browser JSX transform. This lets index.html load escape-room-tracker.jsx
     directly, with no separate build step (npm/Vite/etc). -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
 
<!-- Maps the bare import specifiers used inside escape-room-tracker.jsx
     (react, react-dom/client, lucide-react) to real CDN modules. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>
</head>
<body>
<div id="escape-log-root"><div class="boot-loader">opening the door…</div></div>
 
<!-- The app itself lives entirely in escape-room-tracker.jsx — edit that file,
     nothing here needs to change. Babel fetches it, strips the JSX, and runs
     it as an ES module (data-type="module" keeps the import/export statements
     working via the import map above). Requires being served over http(s)
     (e.g. GitHub Pages) — opening this file directly as file:// won't work
     because the browser blocks the fetch of the .jsx file. -->
<script type="text/babel" data-type="module" data-presets="react" src="./escape-room-tracker.jsx"></script>
</body>
</html>
